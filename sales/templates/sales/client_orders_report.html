<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчёт по заказам клиентов</title>
</head>
<body>
<h2>Отчёт по заказам клиентов</h2>
<table>
    <thead>
    <tr>
        <th>Клиент</th>
        <th>Номер заказа</th>
        <th>Дата</th>
        <th>Сумма заказа</th>
    </tr>
    </thead>
    <tbody>
    {% for order in orders %}
        <tr>
            <td>{{ order.client.name }}</td>
            <td>{{ order.id }}</td>
            <td>{{ order.created_at }}</td>
            <td>{{ order.order_total }}</td>
        </tr>
    {% empty %}
        <tr><td colspan="4">Заказов нет</td></tr>
    {% endfor %}
    </tbody>
</table>
</body>
</html>
