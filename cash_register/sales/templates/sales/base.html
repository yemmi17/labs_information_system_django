<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Кассовые продажи{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d9cf5;
      --positive: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    nav {
      margin-top: 0.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    nav a {
      color: var(--accent);
      text-decoration: none;
    }
    nav a:hover { text-decoration: underline; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #243044;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    tr:last-child td { border-bottom: none; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .total-row td {
      font-weight: 600;
      background: #1e2838;
    }
    .profit { color: var(--positive); }
    p.lead { color: var(--muted); margin-top: 0; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header>
    <h1>{% block header_title %}Продажи через кассовый аппарат{% endblock %}</h1>
    <nav>
      <a href="{% url 'profit_by_group' %}">Прибыль по группам</a>
      <a href="{% url 'sale_list' %}">Все продажи</a>
      <a href="/admin/">Админка</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
